<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>友達の勉強時間</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --text-1: #0b0b0b; --text-2: #52514e;
  --ring: rgba(11, 11, 11, 0.10); --accent: #2a78d6; --danger: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --text-1: #f0efec; --text-2: #c3c2b7;
    --ring: rgba(255, 255, 255, 0.10); --accent: #3987e5; --danger: #e66767;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
  background: var(--page); color: var(--text-1);
  font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
}
main { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 24px; }
h1 { font-size: 18px; margin: 0 0 16px; font-weight: 600; }
label { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
input[type="password"] {
  width: 100%; font: inherit; font-size: 16px; color: var(--text-1); background: var(--page);
  border: 1px solid var(--ring); border-radius: 8px; padding: 10px 12px; min-height: 44px;
}
.chk { display: flex; align-items: center; gap: 8px; margin: 12px 0 16px; }
.chk input { width: 18px; height: 18px; }
button {
  width: 100%; min-height: 44px; font: inherit; font-size: 15px; font-weight: 600; color: #fff;
  background: var(--accent); border: 0; border-radius: 8px; cursor: pointer;
}
button:disabled { opacity: 0.6; cursor: default; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#msg { min-height: 1.4em; margin: 12px 0 0; font-size: 13px; color: var(--text-2); }
#msg.err { color: var(--danger); }
</style>
</head>
<body>
<main>
  <h1>友達の勉強時間</h1>
  <form id="f">
    <label for="pw">パスワード</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <label class="chk"><input id="keep" type="checkbox" checked> この端末で記憶する</label>
    <button id="go" type="submit">開く</button>
    <p id="msg" role="status"></p>
  </form>
</main>

<script>
(() => {
  const P = JSON.parse(document.getElementById('payload').textContent);
  const $ = (id) => document.getElementById(id);
  const KEY = 'friends-board-pw';
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const store = {
    get() { try { return localStorage.getItem(KEY); } catch { return null; } },
    set(v) { try { localStorage.setItem(KEY, v); } catch {} },
    clear() { try { localStorage.removeItem(KEY); } catch {} },
  };
  const say = (text, err) => { $('msg').textContent = text; $('msg').className = err ? 'err' : ''; };

  async function decrypt(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(P.s), iterations: P.n, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.i) }, key, b64(P.c));
    return new TextDecoder().decode(plain);
  }

  async function open(pw, remember, auto) {
    if (!(window.crypto && crypto.subtle)) { say('このページは https で開いてください（暗号を解く機能が使えません）', true); return; }
    $('go').disabled = true;
    say('開いています…');
    let html;
    try {
      html = await decrypt(pw);
    } catch {
      $('go').disabled = false;
      if (auto) { store.clear(); say(''); } else say('パスワードが違います', true);
      return;
    }
    if (remember) store.set(pw);
    document.open();
    document.write(html);
    document.close();
  }

  $('f').addEventListener('submit', (e) => {
    e.preventDefault();
    open($('pw').value, $('keep').checked, false);
  });
  const saved = store.get();
  if (saved) open(saved, true, true);
})();
</script>
